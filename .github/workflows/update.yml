name: Update Arvio M3U
on:
  workflow_dispatch:
  schedule:
    - cron: '45 0,6,12,18 * * *'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: arvio-playlist-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build playlist and audit
        run: python build.py
      - name: Validate generated playlist
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('arvio.m3u')
          lines = p.read_text(encoding='utf-8-sig').splitlines()
          channels = sum(line.startswith('#EXTINF:') for line in lines)
          urls = sum(line.startswith(('http://', 'https://')) for line in lines)
          print(f'Generated {channels} channels and {urls} URLs')
          if not lines or lines[0].strip() != '#EXTM3U' or channels < 100 or urls < channels:
              raise SystemExit('Refusing to publish incomplete playlist')
          PY
      - name: Build compact combined EPG
        run: python merge_epg.py
      - name: Validate generated guide and coverage
        run: |
          python - <<'PY'
          import gzip, json, xml.etree.ElementTree as ET
          from pathlib import Path
          audit = json.loads(Path('epg-audit.json').read_text())
          total = audit.get('playlist_channels', 0)
          covered = audit.get('channels_with_programmes', 0)
          assert total >= 100, f'Unexpected channel count: {total}'
          assert covered >= 200, f'EPG coverage fell below safe floor: {covered}'
          assert covered / total >= 0.90, f'EPG coverage dropped: {covered}/{total}'
          assert Path('epg.xml.gz').stat().st_size > 10000
          programmes = 0
          with gzip.open('epg.xml.gz', 'rb') as stream:
              for _, element in ET.iterparse(stream, events=('end',)):
                  if element.tag == 'programme':
                      programmes += 1
                  element.clear()
          assert programmes >= 1000, f'Too few programmes: {programmes}'
          print(f'Guide validated: {covered}/{total} channels')
          PY
      - name: Publish playlist through pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            arvio.m3u
            audit.json
            epg.xml.gz
            epg-audit.json
          commit-message: Refresh Arvio playlist
          branch: automation/refresh-arvio-playlist
          delete-branch: true
          title: 'Refresh Arvio playlist'
          body: 'Automated playlist and EPG refresh. Protected main requires a pull request.'
      - name: Enable automatic merge of refresh PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr=$(gh pr list --head automation/refresh-arvio-playlist --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr merge "$pr" --squash || gh pr merge "$pr" --auto --squash
          fi
