name: Update Arvio M3U
on:
  workflow_dispatch:
  schedule:
    - cron: '45 0,6,12,18 * * *'
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build playlist and audit
        run: python build.py
      - name: Build compact combined EPG
        run: python merge_epg.py
      - name: Publish playlist through pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            arvio.m3u
            audit.json
            epg.xml.gz
            epg-audit.json
          commit-message: Refresh Arvio playlist
          branch: automation/refresh-arvio-playlist
          delete-branch: true
          title: 'Refresh Arvio playlist'
          body: 'Automated playlist and EPG refresh. Protected main requires a pull request.'
