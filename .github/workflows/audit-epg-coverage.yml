name: Audit EPG Coverage
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check EPG coverage
        run: python3 audit_epg.py
      - name: Upload EPG audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epg-audit
          path: epg-audit.txt
          if-no-files-found: ignore
