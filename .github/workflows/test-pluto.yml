name: Test alternative Pluto streams
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate isolated Pluto test playlist
        run: python pluto_test.py
      - name: Publish test playlist only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pluto-test.m3u pluto-test-audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh experimental Pluto stream candidates'
            git push
          fi
